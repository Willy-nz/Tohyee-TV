name: Website
# Publishes site/ to the gh-pages branch, which GitHub Pages serves at
# https://willy-nz.github.io/Tohyee-TV/
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/website.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the site files are present
        run: test -f site/index.html && test -f site/spitz.svg
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
