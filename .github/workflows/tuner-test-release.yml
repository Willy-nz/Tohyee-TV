name: Package Tohyee TV release
# Superseded by the Windows installer (windows-installer.yml). Kept for
# manual use only, so it can't publish a release that clashes with it.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tuner-alpha-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: node --test
      - name: Read version
        id: version
        run: |
          $version = (Get-Content tuner/package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'No version in tuner/package.json' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; bump the version in tuner/package.json." }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the Windows folder
        run: |
          $out = 'dist/Tohyee TV Tuner'
          New-Item -ItemType Directory -Force "$out/app/src" | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node "$out/node.exe"
          $nodeLicense = Join-Path (Split-Path $node) 'LICENSE'
          if (Test-Path $nodeLicense) { Copy-Item $nodeLicense "$out/NODE-LICENSE.txt" }
          Copy-Item tuner/src/*.js "$out/app/src/"
          Copy-Item tuner/package.json "$out/app/"
          Copy-Item tuner/README.md "$out/README.txt"
          Copy-Item 'tuner/Start Tohyee TV Tuner.cmd' "$out/"
          Copy-Item 'tuner/Test Plex with test picture.cmd' "$out/"
          New-Item -ItemType Directory -Force "$out/Chrome extension" | Out-Null
          Copy-Item extension/* "$out/Chrome extension/"
          $manifest = Get-Content "$out/Chrome extension/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw 'Extension manifest is not MV3' }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length
      - name: Smoke test the packaged tuner with real FFmpeg
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          $dir = Resolve-Path 'dist/Tohyee TV Tuner'
          # Chrome mode first: with no extension connected, Plex must get a clear 503.
          $c = Start-Process -FilePath "$dir\node.exe" -ArgumentList @('app\src\main.js', '--config', "$env:RUNNER_TEMP\tuner.json") -WorkingDirectory $dir -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\chrome-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\chrome-err.txt"
          Start-Sleep -Seconds 3
          $code = curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:34500/stream/1
          if ($code -ne '503') { throw "Expected 503 with no Chrome source, got $code" }
          # Then the real extension code (Chrome's recorder simulated by FFmpeg) feeding the tuner.
          $e = Start-Process -FilePath node -ArgumentList @('scripts/e2e-chrome.mjs', '25') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\e2e-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\e2e-err.txt"
          Start-Sleep -Seconds 3
          curl.exe -sS -m 12 -o "$env:RUNNER_TEMP\chrome.ts" http://127.0.0.1:34500/stream/1
          Start-Sleep -Seconds 8
          Stop-Process -Id $e.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $c.Id -Force
          Get-Content "$env:RUNNER_TEMP\chrome-out.txt", "$env:RUNNER_TEMP\e2e-out.txt", "$env:RUNNER_TEMP\e2e-err.txt"
          $streams = ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "$env:RUNNER_TEMP\chrome.ts"
          "Chrome-path streams: $streams"
          if (-not ($streams -match 'h264') -or -not ($streams -match 'aac')) { throw "Chrome path stream is missing H.264 or AAC: $streams" }
          $errors = ffmpeg -v error -i "$env:RUNNER_TEMP\chrome.ts" -f null - 2>&1
          if ($errors) { throw "Chrome path stream has decode errors: $errors" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\e2e-out.txt" -Pattern 'reloadTab' -Quiet)) { throw 'Extension did not reload the tab when Plex started watching' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\e2e-out.txt" -Pattern 'pauseVideo' -Quiet)) { throw 'Extension did not pause the video when Plex stopped watching' }
          'Chrome path passed.'
          Start-Sleep -Seconds 1
          $p = Start-Process -FilePath "$dir\node.exe" -ArgumentList @('app\src\main.js', '--test-pattern', '--config', "$env:RUNNER_TEMP\tuner.json") -WorkingDirectory $dir -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          try {
            Start-Sleep -Seconds 4
            Get-Content "$env:RUNNER_TEMP\out.txt", "$env:RUNNER_TEMP\err.txt"
            $d = Invoke-RestMethod http://127.0.0.1:34500/discover.json
            if ($d.LineupURL -ne 'http://127.0.0.1:34500/lineup.json') { throw "Unexpected discover.json: $($d | ConvertTo-Json)" }
            $guide = Invoke-WebRequest http://127.0.0.1:34500/guide.xml
            if ($guide.Content -notmatch '<programme ') { throw 'Guide has no programmes' }
            curl.exe -sS -m 8 -o "$env:RUNNER_TEMP\sample.ts" http://127.0.0.1:34500/stream/1
            $streams = ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "$env:RUNNER_TEMP\sample.ts"
            "Streams: $streams"
            if (-not ($streams -match 'h264') -or -not ($streams -match 'aac')) { throw "Stream is missing H.264 or AAC: $streams" }
            $errors = ffmpeg -v error -i "$env:RUNNER_TEMP\sample.ts" -f null - 2>&1
            if ($errors) { throw "Stream has decode errors: $errors" }
            'Smoke test passed.'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process ffmpeg -ErrorAction SilentlyContinue | Stop-Process -Force
            $global:LASTEXITCODE = 0
          }
      - name: Zip
        run: |
          $v = '${{ steps.version.outputs.version }}'
          Compress-Archive -Path 'dist/Tohyee TV Tuner' -DestinationPath "dist/Tohyee-TV-Tuner-$v.zip"
          $hash = (Get-FileHash "dist/Tohyee-TV-Tuner-$v.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Tohyee-TV-Tuner-$v.zip" | Set-Content -NoNewline dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notes = @"
          Broadcast a **Chrome tab** (picture and sound) to Plex as a live TV channel. Chrome only. The video is **paused when nobody is watching** and played again when someone starts.

          The download contains the **tuner** (a Windows program Plex sees as a TV tuner) and the **Chrome extension**. Picture and sound are only sent while someone watches in Plex. The tab can be reloaded and played when someone starts watching, and paused when nobody is.

          ### Quick start (full steps in README.txt)
          1. Download **Tohyee-TV-Tuner-$v.zip** below and extract it somewhere permanent.
          2. Put **ffmpeg.exe** in the extracted *Tohyee TV Tuner* folder.
          3. Double-click **Start Tohyee TV Tuner**; allow it on **Private networks** if Windows asks.
          4. In Chrome: chrome://extensions → Developer mode → Load unpacked → choose the *Chrome extension* folder.
          5. Open your video tab, click the Tohyee TV icon → **Broadcast this tab to Plex**.
          6. In Plex: Settings → Live TV & DVR → DVR Setup, add the tuner address, and use the XMLTV guide address.

          **If Plex already has a DVR set up, read README.txt first** — Plex requires deleting an existing DVR to use an XMLTV guide.

          Automated tests pass, including the real extension code driving the real tuner, and a Windows smoke test with real FFmpeg. Not yet tested with a real Plex server or in real Chrome.
          "@ -replace '(?m)^          ', ''
          # Versions with a suffix (e.g. 0.4.0-alpha.1) are published as prereleases.
          $pre = if ($v -match '-') { @('--prerelease') } else { @() }
          gh release create "v$v" "dist/Tohyee-TV-Tuner-$v.zip" dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Tohyee TV $v — Chrome tab to Plex" --notes $notes @pre
